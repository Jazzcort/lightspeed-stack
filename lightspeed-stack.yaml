name: Lightspeed Core Stack (LCS)
service:
  host: 0.0.0.0
  port: 8080
  base_url: http://localhost:8080
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true
# llama_stack configuration
# When using 'make run', a container is ALWAYS launched at http://localhost:8321 (hardcoded in Makefile).
# This llama_stack section controls where lightspeed-core connects to llama-stack.
# To use a different port: override with 'make run LLAMA_STACK_PORT=<port>' and update the url below,
# or run llama-stack manually and don't use 'make run'.
llama_stack:
  use_as_library_client: false
  url: http://localhost:8321
  # api_key: custom-key  # Uncomment if your llama-stack requires authentication
user_data_collection:
  feedback_enabled: true
  feedback_storage: "/tmp/data/feedback"
  transcripts_enabled: true
  transcripts_storage: "/tmp/data/transcripts"

# Conversation cache for storing Q&A history
conversation_cache:
  type: "sqlite"
  sqlite:
    db_path: "/tmp/data/conversation-cache.db"  # Persistent across requests, can be deleted between test runs

authentication:
  module: "noop"

shields:
  - name: granite-guardian
    provider_id: granite_guardian
    config:
      url: https://granite-guardian-4-1-8b--apicast-production.apps.int.stc.ai.prod.us-east-1.aws.paas.redhat.com/v1
      api_key: dummy
      verify_ssl: false
      risks:
        - name: harm
          # enabled: false
          description: >-
            Texts deemed universally harmful are those that pose harm across all
            contexts and audiences, except when the message is a technical question
            about a CVE (Common Vulnerabilities and Exposures).
  # - name: question-validity
  #   provider_id: question_validity
  #   config:
  #     model_id: openai/gpt-4o-mini
